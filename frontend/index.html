<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymSaaS — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <h1>GymSaaS</h1>
      <p>Gym Management Platform</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('gym')">Gym Owner</button>
      <button class="auth-tab" onclick="switchTab('admin')">Super Admin</button>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="loginBtn">Login</button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:0.82rem;color:#94a3b8;">
      New gym? <a href="register.html" style="color:#f97316;font-weight:600;">Register free →</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  let currentRole = 'gym_owner';

  if (getToken()) {
    const role = getRole();
    if (role === 'super_admin') window.location.href = 'super-admin/dashboard.html';
    else window.location.href = 'gym-admin/dashboard.html';
  }

  function switchTab(tab) {
    currentRole = tab === 'admin' ? 'super_admin' : 'gym_owner';
    document.querySelectorAll('.auth-tab').forEach((t, i) => t.classList.toggle('active', (i === 0) === (tab === 'gym')));
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.textContent = 'Logging in...';
    btn.disabled = true;

    const res = await api('POST', '/auth/login/', {
      email: document.getElementById('loginEmail').value.trim(),
      password: document.getElementById('loginPassword').value,
      role: currentRole
    });

    btn.textContent = 'Login';
    btn.disabled = false;

    if (!res) return;
    const data = await res.json();

    if (!res.ok) {
      showToast(data.error || 'Login failed.', 'error');
      return;
    }

    saveAuth(data);
    if (data.role === 'super_admin') window.location.href = 'super-admin/dashboard.html';
    else window.location.href = 'gym-admin/dashboard.html';
  }
</script>
</body>
</html>
