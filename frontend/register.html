<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — GymSaaS</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-box { max-width: 600px; }
    .trial-badge { background: #14532d; color: #86efac; border-radius: 20px; padding: 6px 16px; font-size: 0.8rem; font-weight: 600; display: inline-block; margin-bottom: 20px; }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <h1>GymSaaS</h1>
      <p>Create your gym account</p>
    </div>
    <div style="text-align:center;"><span class="trial-badge">✅ 7-Day Free Trial — No credit card needed</span></div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-row">
        <div class="form-group">
          <label>Gym Name *</label>
          <input type="text" id="gymName" placeholder="e.g. FitZone Gym" required />
        </div>
        <div class="form-group">
          <label>Owner Name *</label>
          <input type="text" id="ownerName" placeholder="e.g. Rahul Sharma" required />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Mobile Number *</label>
          <input type="tel" id="mobile" placeholder="e.g. 9876543210" required />
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="email" placeholder="rahul@gmail.com" required />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Password *</label>
          <input type="password" id="password" placeholder="Min 6 characters" required />
        </div>
        <div class="form-group">
          <label>City</label>
          <input type="text" id="city" placeholder="e.g. Pune" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>State</label>
          <input type="text" id="state" placeholder="e.g. Maharashtra" />
        </div>
        <div class="form-group">
          <label>Address</label>
          <input type="text" id="address" placeholder="Gym address" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Opening Time</label>
          <input type="time" id="openingTime" />
        </div>
        <div class="form-group">
          <label>Closing Time</label>
          <input type="time" id="closingTime" />
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;" id="regBtn">
        Create Account & Start Free Trial
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:0.82rem;color:#94a3b8;">
      Already have an account? <a href="index.html" style="color:#f97316;font-weight:600;">Login →</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    btn.textContent = 'Creating account...';
    btn.disabled = true;

    const body = {
      gym_name: document.getElementById('gymName').value.trim(),
      owner_name: document.getElementById('ownerName').value.trim(),
      mobile: document.getElementById('mobile').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
      city: document.getElementById('city').value.trim(),
      state: document.getElementById('state').value.trim(),
      address: document.getElementById('address').value.trim(),
      opening_time: document.getElementById('openingTime').value || null,
      closing_time: document.getElementById('closingTime').value || null,
    };

    const res = await api('POST', '/auth/register/', body);
    btn.textContent = 'Create Account & Start Free Trial';
    btn.disabled = false;

    if (!res) return;
    const data = await res.json();

    if (!res.ok) {
      const msg = Object.values(data).flat()[0] || 'Registration failed.';
      showToast(msg, 'error');
      return;
    }

    saveAuth(data);
    showToast('Welcome! Your 7-day free trial has started.');
    setTimeout(() => window.location.href = 'gym-admin/dashboard.html', 1000);
  }
</script>
</body>
</html>
